<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="ambient" cx="78%" cy="45%" r="65%">
      <stop stop-color="#14151e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ambient)"/>
  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="74" y="320" fill="#fafafa" font-size="104" font-weight="600" letter-spacing="-5">Liquid Web</text>
    <text x="80" y="378" fill="#92929b" font-size="28" font-weight="400" letter-spacing="-.4">Fluid interfaces for the web</text>
  </g>
  <svg xmlns="http://www.w3.org/2000/svg" x="642" y="32" width="512" height="512" viewBox="0 0 64 64">
  <defs>
    <g id="colors">
      <circle cx="22.5" cy="28.3" r="15.7" fill="#ff4f81"/>
      <circle cx="44" cy="38.8" r="14.6" fill="#2f7bff"/>
    </g>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
      <feColorMatrix type="saturate" values="2"/>
    </filter>
    <clipPath id="glass">
      <rect x="4" y="17" width="56" height="31" rx="15.5"/>
    </clipPath>
    <linearGradient id="shade">
      <stop stop-color="#000" stop-opacity=".35"/>
      <stop offset=".16" stop-color="#000" stop-opacity="0"/>
      <stop offset=".84" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <use href="#colors"/>
  <g clip-path="url(#glass)">
    <rect x="4" y="17" width="56" height="31" fill="#0a0a0a"/>
    <use href="#colors" filter="url(#blur)"/>
    <rect x="4" y="17" width="56" height="31" fill="#3a3a3a" fill-opacity=".25"/>
    <rect x="4" y="17" width="56" height="31" fill="url(#shade)"/>
  </g>
  <rect x="4.12" y="17.12" width="55.76" height="30.76" rx="15.38" fill="none" stroke="url(#rim)" stroke-width=".24"/>
</svg>
</svg>
